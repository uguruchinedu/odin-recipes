<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Odin Recipes</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
        <nav class="navbar">
        <a href="index.html" class="logo">Odin Recipes</a>

        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html"  class="active">Contact</a>
            <input type="search" placeholder="Search...">
        </div>
    </nav>

    <main class="contact-page"> 
        <section class="contact-intro"> 
            <h1>Contact Us</h1>
             
            <p> Have you any question, suggestion, or feedback about Odin Recipes? We would love to hear from you. </p> 

        </section>

        <section class="contact-form-section"> 
            <h2>Send Us a Message</h2> 
            <form class="contact-form">
                <div class="form-group"> 
                    <label for="name">Full Name</label> 
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required> 
                </div> 
                <div class="form-group"> 
                    <label for="email">Email Address</label> 
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required> 
                </div> 
                <div class="form-group"> 
                    <label for="subject">Subject</label> 
                    <input type="text" id="subject" name="subject" placeholder="What is your message about?" required> 
                </div> 
                <div class="form-group"> 
                    <label for="message">Your Message</label> 
                    <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required>

                    </textarea> 
                </div> 
                <button type="submit">Send Message</button> 
            </form> 
        </section>

        <section class="feedback-section"> 
            <h2>Share Your Feedback</h2> 
            <p>
                How would you rate your experience with Odin Recipes?
            </p> 
            <form class="feedback-form"> 
                <div class="form-group"> 
                    <label for="rating">Rate Us (1–5 Stars)</label> 
                    <select id="rating" name="rating" required> 
                        <option value="">Choose a rating</option> 
                        <option value="5">★★★★★ - Excellent</option> 
                        <option value="4">★★★★ - Very Good</option> 
                        <option value="3">★★★ - Good</option> 
                        <option value="2">★★ - Fair</option> 
                        <option value="1">★ - Poor</option> 
                    </select> 
                </div> 
                <div class="form-group"> 
                    <label for="feedback">Your Comments</label> 
                    <textarea id="feedback" name="feedback" rows="5" placeholder="Tell us what you think..." required>

                    </textarea> 
                </div> 
                <button type="submit">Submit Feedback</button> 
            </form> 
        </section>
     </main>

    
</body>
</html>
